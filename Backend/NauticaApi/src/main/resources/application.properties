spring.application.name=nauticaapi

# Lee las credenciales del archivo .env (no se sube a GitHub)
spring.config.import=optional:file:.env[.properties]

# Conexion con PostgreSQL (Neon)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nautica_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# CONFIGURACION JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# CORS: origenes permitidos separados por coma
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Contrasena de los usuarios de prueba (gerente@poseidon.pe, etc.)
app.demo.password=${DEMO_PASSWORD:Poseidon2026}

# Puerto (Render lo asigna con la variable PORT)
server.port=${PORT:8080}