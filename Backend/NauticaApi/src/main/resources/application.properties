spring.application.name=nauticaapi

# Lee las credenciales del archivo .env (no se sube a GitHub)
spring.config.import=optional:file:.env[.properties]

# Conexion con PostgreSQL (Neon)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nautica_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Crea el esquema "auditoria" si no existe
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Datos iniciales (catalogos, modulos, roles, usuarios de prueba): src/main/resources/db/data.sql
# Se ejecuta despues de que Hibernate crea las tablas
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# CONFIGURACION JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# CORS: origenes permitidos separados por coma
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Puerto (Render lo asigna con la variable PORT)
server.port=${PORT:8080}

# Auditoria
app.version=1.0.0
# Detras del proxy de Render, toma la IP real del cliente (X-Forwarded-For)
server.forward-headers-strategy=FRAMEWORK

# Actuator
# Endpoints expuestos: /actuator/health, /actuator/info, /actuator/metrics, /actuator/beans
management.endpoints.web.exposure.include=health,info,metrics,beans
# Mostrar detalles del estado de salud (base de datos, disco)
management.endpoint.health.show-details=always
# Puerto de administracion: 8081 en local. En Render se usa el mismo puerto de la API (variable PORT)
management.server.port=${PORT:8081}

# Informacion de la aplicacion (/actuator/info)
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Backend del Sistema de Inscripcion de Socios - Club Nautico Poseidon
info.app.version=${app.version}

# Documentos de embarcaciones (PDF, JPG o PNG)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Rendimiento: carga las relaciones en lotes en lugar de una consulta por registro
spring.jpa.properties.hibernate.default_batch_fetch_size=100
