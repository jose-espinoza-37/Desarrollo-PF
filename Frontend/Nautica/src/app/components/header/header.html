
<header class="site-header">
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <!-- Identidad del club -->
      <a
        class="navbar-brand"
        href="#inicio"
        (click)="desplazarA($event)"
        aria-label="Club Náutico Poseidón, ir al inicio"
      >
        <span class="brand-club">CLUB NÁUTICO</span>
        <span class="brand-name">Poseidón<span class="brand-period">.</span></span>
      </a>

      <!-- Botón del menú para móviles -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNautica"
        aria-controls="navbarNautica"
        aria-expanded="false"
        aria-label="Abrir menú de navegación"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Enlaces de navegación -->
      <div class="collapse navbar-collapse" id="navbarNautica">
        <ul class="navbar-nav me-auto align-items-lg-center">
          <li class="nav-item">
            <a
              class="nav-link"
              href="#inicio"
              (click)="desplazarA($event)"
            >
              Inicio
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              href="#nosotros"
              (click)="desplazarA($event)"
            >
              Nosotros
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              href="#servicios"
              (click)="desplazarA($event)"
            >
              Servicios
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              href="#instalaciones"
              (click)="desplazarA($event)"
            >
              Instalaciones
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/contacto">
              Contacto
            </a>
          </li>
        </ul>

        <!-- Acciones principales -->
        <div class="header-actions d-flex flex-column flex-lg-row gap-2">
          <a
            href="#contacto"
            class="btn btn-login"
            (click)="desplazarA($event)"
          >
            Iniciar sesión
          </a>

          <a
            href="#contacto"
            class="btn btn-member"
            (click)="desplazarA($event)"
          >
            Hazte socio
            <span aria-hidden="true">→</span>
          </a>
        </div>
      </div>
    </div>
  </nav>
</header>
