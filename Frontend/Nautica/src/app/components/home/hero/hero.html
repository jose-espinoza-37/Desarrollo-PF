
<section
  id="inicio"
  class="hero d-flex align-items-center text-white"
>
  <div class="container hero-container">
    <div class="hero-content">
      <p class="hero-eyebrow">
        CLUB NÁUTICO POSEIDÓN DEL PERÚ
      </p>

      <h1 class="hero-title">
        Vive el mar.
        <span>Disfruta la experiencia.</span>
      </h1>

      <p class="hero-description">
        Un espacio pensado para quienes aman el mar,
        disfrutan la navegación y comparten la pasión por la vida náutica.
      </p>

      <div class="hero-actions d-flex flex-column flex-sm-row gap-3">
        <a
          href="#contacto"
          class="btn hero-btn-primary"
          (click)="desplazarA($event)"
        >
          Quiero ser socio
          <span aria-hidden="true">→</span>
        </a>

        <a
          href="#servicios"
          class="btn hero-btn-secondary"
          (click)="desplazarA($event)"
        >
          Conoce nuestros servicios
        </a>
      </div>
    </div>
  </div>

  <div class="hero-bottom-line" aria-hidden="true"></div>
</section>
