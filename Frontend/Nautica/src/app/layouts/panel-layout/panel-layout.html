<div class="panel" [class.menu-abierto]="menuAbierto()">
  <!-- Menú lateral: se arma dinámicamente según el rol -->
  <aside class="sidebar">
    <a routerLink="/" class="sidebar-brand">
      <span class="brand-club">CLUB NÁUTICO</span>
      <span class="brand-name">Poseidón<span class="brand-period">.</span></span>
    </a>

    <div class="sidebar-rol">
      <i class="bi bi-shield-lock"></i>
      {{ usuario()?.rolNombre }}
    </div>

    <nav class="sidebar-nav">
      @for (modulo of menu(); track modulo.codigo) {
        <a
          class="sidebar-link"
          [routerLink]="modulo.ruta"
          routerLinkActive="activo"
          (click)="cerrarMenu()"
        >
          <i class="bi {{ modulo.icono }}"></i>
          <span>{{ modulo.nombre }}</span>
        </a>
      } @empty {
        <p class="sidebar-vacio">Tu perfil no tiene opciones asignadas.</p>
      }
    </nav>

    <button type="button" class="btn btn-salir" (click)="cerrarSesion()">
      <i class="bi bi-box-arrow-right"></i> Cerrar sesión
    </button>
  </aside>

  <div class="sombra" (click)="cerrarMenu()"></div>

  <!-- Zona de contenido -->
  <div class="contenido">
    <header class="topbar">
      <button type="button" class="btn btn-menu d-lg-none" (click)="alternarMenu()" aria-label="Abrir menú">
        <i class="bi bi-list"></i>
      </button>

      <div class="ms-auto d-flex align-items-center gap-3">
        <div class="text-end d-none d-sm-block">
          <div class="usuario-nombre">{{ usuario()?.nombres }}</div>
          <div class="usuario-correo">{{ usuario()?.correo }}</div>
        </div>
        <div class="avatar">{{ iniciales() }}</div>
      </div>
    </header>

    <main class="pagina">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
